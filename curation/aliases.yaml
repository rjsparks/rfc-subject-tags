  - "SHA-256"   # raw 452 ctx 452 100% -- By far the most frequently named individual member in RFC text; no tag of its own and not reachable from the desc, since `sha` does not start with `sha-256`.
  - "Keccak"   # raw 8 ctx 8 100% -- The algorithm name under which SHA-3 was designed and selected; appears in RFC text and readers may type it instead of SHA-3. No tag of its own and nothing in the desc matches it.
  - "SHAKE"   # raw 32 ctx 20 62% -- The extendable-output functions SHAKE128/SHAKE256 are defined in FIPS 202 alongside SHA-3 and appear in RFCs such as 8692; no tag of their own, and SHA is the closest home. Listed in covers rather than aliases because an XOF is not simply another name for SHA.

