sha:
  aliases:
  - "SHS"   # raw 160 ctx 157 98% -- Abbreviation of "Secure Hash Standard", the FIPS name for the SHA family; RFCs routinely cite it as [SHS] (e.g. RFC 4634, RFC 6234). Another name for the same thing, and not reachable from the desc, whose indexed words are the/sha/secure/hash/algorithm/family/of/functions.
  covers:
  - "SHA-1"   # raw 510 ctx 510 100% -- The desc declares this tag a family (a category), and there is no sha-1 tag in the vocabulary, so a reader typing SHA-1 has nowhere more specific to land. Not reachable today: the desc word `sha` does not start with `sha-1`.
  - "SHA-2"   # raw 68 ctx 68 100% -- Distinct member of the family (SHA-224/256/384/512) with no tag of its own; the desc word `sha` does not start with `sha-2`, so it is unreachable today.
