# Builds the taxonomy artifacts and publishes them to GitHub Pages.
#
# The build fetches the RFC index fresh each run, so the published page tracks the
# current corpus. regen.py also rewrites taxonomy.yaml, README.md and validation.md;
# those edits are discarded here. Keeping them current is a curator step, run locally
# and committed by a person — this workflow commits nothing.
#
# Requires: repository Settings > Pages > Source set to "GitHub Actions".

name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, to pick up newly published RFCs. Note GitHub disables scheduled
    # workflows after 60 days without repository activity.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share one group so they queue instead of racing: Pages serves a
# single live site. Pull requests do not deploy, so each gets its own group. While
# they shared the 'pages' group, GitHub kept only one run queued per group and
# cancelled the rest — two pull requests opened together could each cancel the
# other's build, and merge with the build having never run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build corpus
        run: python3 make_corpus_from_index.py

      - name: Assign tags
        run: python3 engine.py

      - name: Regenerate artifacts
        run: python3 regen.py

      # Acronyms that appeared in an RFC title beside their expansion and that no
      # reader can currently reach by searching the tag they belong to. Costs
      # nothing (no model, no network) and commits nothing: the list is published
      # beside the other artifacts for a curator to read. Candidates only -- see
      # code.md for what they are and are not.
      - name: Collect alias candidates
        run: python3 alias_candidates.py --out alias-candidates.json

      - name: Stage site
        run: |
          mkdir -p _site
          cp rfc-tags.html _site/index.html
          cp rfc-tags.json rfc-tags.csv rfcs.json alias-candidates.json _site/

      # On a pull request, build only: Pages serves one live site, so a PR must not
      # deploy over it. The staged site is attached to the run instead — download it
      # and open index.html to review the page a merge would publish.
      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
